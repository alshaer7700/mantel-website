name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The .tsx files carried type annotations for months with no compiler
      # installed to check them. This is the gate that keeps them honest.
      - name: Typecheck
        run: npm run typecheck

      # Only src/lib/api/* may talk to Supabase directly. Without this, the
      # next inline query lands back in a component and the data layer quietly
      # stops being one. There is no ESLint here to express it as a rule.
      - name: Enforce the data-layer boundary
        run: |
          # Matches IMPORTS, not prose. The first version grepped for the
          # bare word and failed on a comment that merely mentioned the
          # module — a check that flags documentation is a check people
          # learn to ignore.
          offenders=$(grep -rlE "^\s*import[^;]*from\s+[\"']([^\"']*/)?supabaseClient[\"']" src \
            --include=*.ts --include=*.tsx \
            | grep -v "^src/lib/api/" \
            | grep -v "^src/lib/supabaseClient.ts$" || true)
          if [ -n "$offenders" ]; then
            echo "::error::These files import supabaseClient outside src/lib/api/:"
            echo "$offenders"
            exit 1
          fi

      # A build needs the two VITE_ vars or supabaseClient throws at import
      # time. Values are irrelevant to a build — nothing connects — so CI uses
      # placeholders rather than carrying real credentials as secrets.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
