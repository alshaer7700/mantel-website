<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="format-detection" content="telephone=no" />

    <title>Mantel — Hidd, Kingdom of Bahrain</title>

    <!--
      The previous description ended "and order before you reach", which the
      site cannot currently do: EXECUTE on place_order is revoked until
      ordering launches. A promise in a search result is still a promise.
    -->
    <meta
      name="description"
      content="Mantel — a café and a small house of objects in Hidd, Kingdom of Bahrain. Coffee poured at the counter, candles and matches wrapped at the shelf."
    />
    <link rel="canonical" href="https://bymantel.com/" />

    <!--
      Link previews. Most of this café's traffic arrives from Instagram and
      WhatsApp, where a shared link with no preview renders as a bare URL. The
      heart is the mark people recognise, and it is already served from public/
      at a stable path.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mantel" />
    <meta property="og:title" content="Mantel — Hidd, Kingdom of Bahrain" />
    <meta
      property="og:description"
      content="A café and a small house of objects. Coffee poured at the counter, candles and matches wrapped at the shelf."
    />
    <meta property="og:url" content="https://bymantel.com/" />
    <meta property="og:image" content="https://bymantel.com/heart.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mantel — Hidd, Kingdom of Bahrain" />
    <meta name="twitter:description" content="A café and a small house of objects. Coffee poured at the counter, candles and matches wrapped at the shelf." />
    <meta name="twitter:image" content="https://bymantel.com/heart.webp" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/heart.webp" type="image/webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Mantel",
        "url": "https://bymantel.com/",
        "image": "https://bymantel.com/heart.webp",
        "description": "A café and small house of objects in Hidd, Kingdom of Bahrain.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hidd",
          "addressCountry": "BH"
        },
        "sameAs": ["https://www.instagram.com/bymantel/"]
      }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
